# Configuration reservee aux tests automatises.
#
# Les tests S2-02 a S2-06 ne portent pas sur la securite : ils conservent leur
# comportement d'origine grace a permit-all. Les tests S2-07 ecrasent cette
# propriete a false pour verifier le vrai comportement (401, JWT, routes
# publiques).
gateway.security.permit-all=true

# Secret de test uniquement : jamais utilise hors des tests.
gateway.security.jwt.secret=test-only-jwt-secret-change-me-0123456789

# Utilisateurs de demonstration de test (valeurs fictives, non secretes).
gateway.security.demo-users.donor.username=donor
gateway.security.demo-users.donor.password=test-donor-password
gateway.security.demo-users.staff.username=staff
gateway.security.demo-users.staff.password=test-staff-password
gateway.security.demo-users.hopital.username=hopital
gateway.security.demo-users.hopital.password=test-hopital-password
gateway.security.demo-users.admin.username=admin
gateway.security.demo-users.admin.password=test-admin-password

# Limitation de debit (S2-09) : desactivee par defaut pour preserver le
# comportement des suites S2-02 a S2-08 (certaines envoient plus de 120
# requetes depuis 127.0.0.1 en quelques secondes). Les tests S2-09
# l'activent explicitement avec une limite basse.
gateway.rate-limit.enabled=false
