server:
  # Port d'ecoute du gateway (le 8080 standard est occupe par Oracle XE sur cette machine).
  port: 8090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # =====================================================================
      # Timeouts du client HTTP (S2-04)
      # connect-timeout : entier en millisecondes.
      # response-timeout : duree, suffixe "ms" (valeur en millisecondes).
      # Le delai de reponse doit rester superieur au delai de 2 s utilise
      # par Donneurs lors d'un don vers Don & Stock.
      # =====================================================================
      httpclient:
        connect-timeout: "${GATEWAY_CONNECT_TIMEOUT_MS:2000}"
        response-timeout: "${GATEWAY_RESPONSE_TIMEOUT_MS:10000}ms"

      # =====================================================================
      # CORS global (S2-03)
      # Origines autorisees : variable CORS_ALLOWED_ORIGINS (defaut localhost:3000).
      # Plusieurs origines sont possibles, separees par des virgules.
      # add-to-simple-url-handler-mapping permet de repondre au preflight
      # (OPTIONS) meme lorsque aucune route ne correspond.
      # =====================================================================
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - X-Request-Id
            exposedHeaders:
              - Location
              - X-Request-Id

      routes:

        # =====================================================================
        # Microservice Donneurs : service-donneurs (port 8081)
        # Cible configurable via la variable d'environnement DONNEURS_URL.
        # Exemple : DONNEURS_URL=http://localhost:8081
        # =====================================================================

        # /api/v1/centres/{id}/creneaux est declare AVANT /api/v1/centres/**
        # et avec un ordre plus prioritaire pour lever toute ambiguite.
        - id: donneurs-centres-creneaux
          uri: "${DONNEURS_URL:http://localhost:8081}"
          order: -1
          predicates:
            - "Path=/api/v1/centres/{id}/creneaux"

        - id: donneurs-centres
          uri: "${DONNEURS_URL:http://localhost:8081}"
          predicates:
            - "Path=/api/v1/centres/**"

        - id: donneurs-donneurs
          uri: "${DONNEURS_URL:http://localhost:8081}"
          predicates:
            - "Path=/api/v1/donneurs/**"

        - id: donneurs-rendez-vous
          uri: "${DONNEURS_URL:http://localhost:8081}"
          predicates:
            - "Path=/api/v1/rendez-vous/**"

        - id: donneurs-dons
          uri: "${DONNEURS_URL:http://localhost:8081}"
          predicates:
            - "Path=/api/v1/dons/**"

        - id: donneurs-certificats
          uri: "${DONNEURS_URL:http://localhost:8081}"
          predicates:
            - "Path=/api/v1/certificats/**"

        # =====================================================================
        # Microservice Demandes : service-demandes (port 8082)
        # Cible configurable via la variable d'environnement DEMANDES_URL.
        # Exemple : DEMANDES_URL=http://localhost:8082
        # =====================================================================
        - id: demandes-demandes
          uri: "${DEMANDES_URL:http://localhost:8082}"
          predicates:
            - "Path=/api/v1/demandes/**"

        - id: demandes-appels
          uri: "${DEMANDES_URL:http://localhost:8082}"
          predicates:
            - "Path=/api/v1/appels/**"

        # Flux temps reel du stock (server-sent events, S2-04).
        # Route plus specifique que /api/v1/stock/** (order -1).
        # response-timeout negatif : aucun timeout de reponse pour ce flux,
        # qui doit rester ouvert au-dela du timeout global.
        - id: demandes-stock-flux
          uri: "${DEMANDES_URL:http://localhost:8082}"
          order: -1
          metadata:
            response-timeout: -1
          predicates:
            - "Path=/api/v1/stock/niveaux/flux"

        - id: demandes-stock
          uri: "${DEMANDES_URL:http://localhost:8082}"
          predicates:
            - "Path=/api/v1/stock/**"

# =========================================================================
# Securite JWT (S2-07)
# Le secret est obligatoire (au moins 32 caracteres) et n'a aucune valeur
# par defaut : il est fourni par la variable JWT_SECRET (.env / variables
# d'environnement), jamais commitee.
# Les quatre utilisateurs de demonstration sont egalement configures par
# variables d'environnement ; les mots de passe n'ont pas de valeur par
# defaut. Les roles sont fixes par le code (DONOR, STAFF_CENTRE, HOPITAL,
# ADMIN), conformement a l'enonce.
# =========================================================================
gateway:
  security:
    jwt:
      secret: "${JWT_SECRET:}"
    demo-users:
      donor:
        username: "${DEMO_DONOR_USERNAME:donor}"
        password: "${DEMO_DONOR_PASSWORD:}"
      staff:
        username: "${DEMO_STAFF_USERNAME:staff}"
        password: "${DEMO_STAFF_PASSWORD:}"
      hopital:
        username: "${DEMO_HOPITAL_USERNAME:hopital}"
        password: "${DEMO_HOPITAL_PASSWORD:}"
      admin:
        username: "${DEMO_ADMIN_USERNAME:admin}"
        password: "${DEMO_ADMIN_PASSWORD:}"

  # =========================================================================
  # Limitation de debit (S2-09)
  # Compteur en memoire, par adresse IP, fenetre fixe de 60 secondes.
  # RATE_LIMIT_PER_MIN vaut 120 par defaut. Le compteur n'est pas partage
  # entre plusieurs instances du gateway (voir gateway/README.md).
  # =========================================================================
  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    per-minute: "${RATE_LIMIT_PER_MIN:120}"

# Actuator : endpoint de sante (S2-01).
management:
  endpoints:
    web:
      exposure:
        include: health

# Logs sur la sortie standard (S2-05). Le motif affiche l'identifiant de
# requete place dans le MDC par RequestIdFilter ; les lignes hors requete
# affichent [].
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
