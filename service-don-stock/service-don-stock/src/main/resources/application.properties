spring.application.name=service-don-stock

# ===== HTTP port (Actuator only) =====
server.port=8083

# ===== gRPC port =====
grpc.server.port=9090

# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/stock-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===== SOAP client (service-cnts) =====
cnts.url=${CNTS_URL:http://service-cnts:8084/ws}
soap.timeout.ms=${SOAP_TIMEOUT_MS:3000}

# ===== gRPC outbound (not used by this service, kept for reference) =====
# grpc.client.donstock.address=static://service-don-stock:9090

# ===== Resilience4j =====
resilience4j.circuitbreaker.instances.cnts.register-health-indicator=true
resilience4j.circuitbreaker.instances.cnts.sliding-window-size=5
resilience4j.circuitbreaker.instances.cnts.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cnts.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cnts.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cnts.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.cnts.max-attempts=3
resilience4j.retry.instances.cnts.wait-duration=500ms
resilience4j.retry.instances.cnts.enable-exponential-backoff=true
resilience4j.retry.instances.cnts.exponential-backoff-multiplier=2

# ===== Business settings =====
app.volume-prelevement-ml=${VOLUME_PRELEVEMENT_ML:450}
app.retry-jobs-interval-sec=${RETRY_JOBS_INTERVAL_SEC:60}
app.delai-livraison-sec=${DELAI_LIVRAISON_SEC:30}
app.delai-qualification-sec=${DELAI_QUALIFICATION_SEC:20}
app.seuil-bas-multiplier=1
app.seuil-moyen-multiplier=2
