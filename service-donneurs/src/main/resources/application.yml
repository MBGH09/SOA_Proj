spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/donneurs}
    username: ${SPRING_DATASOURCE_USERNAME:donneurs}
    password: ${SPRING_DATASOURCE_PASSWORD:donneurs}

  application:
    name: service-donneurs

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

blood:
  age-min: ${AGE_MIN:18}
  age-max: ${AGE_MAX:70}
  age-premier-don-max: ${AGE_PREMIER_DON_MAX:65}
  poids-min-kg: ${POIDS_MIN_KG:50}
  volume-prelevement-ml: ${VOLUME_PRELEVEMENT_ML:450}
  repos-min-minutes: ${REPOS_MIN_MINUTES:15}
  creneau-capacite-defaut: ${CRENEAU_CAPACITE_DEFAUT:4}
  retry-jobs-interval-sec: ${RETRY_JOBS_INTERVAL_SEC:60}
  grpc-deadline-ms: ${GRPC_DEADLINE_MS:2000}
  don-stock-grpc-target: ${DON_STOCK_GRPC_TARGET:static://service-don-stock:9090}

management:
  endpoints:
    web:
      exposure:
        include: health