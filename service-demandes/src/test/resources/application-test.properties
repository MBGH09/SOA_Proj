# Base H2 en memoire (mode PostgreSQL) pour les tests, sans Docker.
# Flyway joue la vraie migration V1. Hibernate ne valide pas le schema ici :
# la validation (ddl-auto=validate) se fait sur PostgreSQL au demarrage reel.
spring.datasource.url=jdbc:h2:mem:demandes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
