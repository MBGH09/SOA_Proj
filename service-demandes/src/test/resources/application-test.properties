# ─────────────────────────────────────────────────────────────────────────────
# Configuration de test : base H2 en mémoire (mode PostgreSQL), sans Docker.
# Flyway rejoue la vraie migration V1. ddl-auto=none → Hibernate ne touche pas
# au schéma ; c'est Flyway qui en a la responsabilité.
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:demandes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Désactive le scheduler pendant les tests pour éviter que ReconciliationJob
# ne s'exécute entre deux assertions.
spring.task.scheduling.enabled=false

# Propriétés métier nécessaires à DemandesRulesProperties
demandes.compensation-min=2
demandes.compensation-max=3
demandes.grpc-deadline-ms=2000
demandes.retry-jobs-interval-sec=60
demandes.don-stock-grpc-target=service-don-stock:9090
demandes.donneurs-url=http://service-donneurs:8081

# Resilience4j — fenêtre très petite pour que les tests de disjoncteur soient
# rapides (seuil atteint en 5 appels, pas besoin d'attendre 10).
resilience4j.circuitbreaker.instances.donStock.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.donStock.sliding-window-size=5
resilience4j.circuitbreaker.instances.donStock.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.donStock.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.donStock.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.instances.donStock.automatic-transition-from-open-to-half-open-enabled=false

resilience4j.circuitbreaker.instances.donneurs.sliding-window-size=5
resilience4j.circuitbreaker.instances.donneurs.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.donneurs.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.donneurs.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.instances.donneurs.automatic-transition-from-open-to-half-open-enabled=false

# Actuator minimal
management.endpoints.web.exposure.include=health,circuitbreakers
