# ─────────────────────────────────────────────────────────────────────────────
# service-demandes — configuration de production
# Toutes les valeurs sensibles viennent de variables d'environnement.
# Ce fichier ne contient aucun secret.
# Les valeurs par défaut pointent vers les noms DNS Docker Compose.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=service-demandes
server.port=8082
server.shutdown=graceful

# ── Base de données ──────────────────────────────────────────────────────────
# En production Docker les variables DEMANDES_DB_HOST/PORT/NAME sont fournies
# par docker-compose.yml ; en développement local utiliser application.yml.
spring.datasource.url=jdbc:postgresql://${DEMANDES_DB_HOST:localhost}:${DEMANDES_DB_PORT:5435}/${DEMANDES_DB_NAME:demandes}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
# spring.datasource.url=jdbc:postgresql://${DEMANDES_DB_HOST:localhost}:${DEMANDES_DB_PORT:5432}/${DEMANDES_DB_NAME:service-demandes-db}
# spring.datasource.username=${POSTGRES_USER:postgres}
# spring.datasource.password=${POSTGRES_PASSWORD:0000}
# spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

spring.flyway.enabled=true

# ── SSE ──────────────────────────────────────────────────────────────────────
# Désactive le timeout des réponses asynchrones (SseEmitter).
# Le Gateway doit aussi désactiver le response-timeout sur /api/v1/stock/niveaux/flux.
spring.mvc.async.request-timeout=-1

# ── Clients sortants ─────────────────────────────────────────────────────────
demandes.grpc-deadline-ms=${GRPC_DEADLINE_MS:2000}
demandes.retry-jobs-interval-sec=${RETRY_JOBS_INTERVAL_SEC:60}
demandes.don-stock-grpc-target=${DON_STOCK_GRPC_TARGET:service-don-stock:9090}
demandes.donneurs-url=${DONNEURS_URL:http://service-donneurs:8081}
demandes.compensation-min=${COMPENSATION_MIN:2}
demandes.compensation-max=${COMPENSATION_MAX:3}

# ── Actuator ─────────────────────────────────────────────────────────────────
# Expose health (Docker healthcheck + Gateway), circuitbreakers (démo D6), info.
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.probes.enabled=true

# ── OpenAPI ──────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
