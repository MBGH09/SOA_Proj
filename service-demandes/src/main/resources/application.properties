spring.application.name=service-demandes
server.port=8082
server.shutdown=graceful

# Base de donnees : valeurs fournies par les variables documentees (aucun secret dans Git)
spring.datasource.url=jdbc:postgresql://${DEMANDES_DB_HOST}:${DEMANDES_DB_PORT}/${DEMANDES_DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Dates : les Instant sont stockes en UTC dans des colonnes TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Actuator : /actuator/health pour Docker et le CI
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Documentation interactive : /swagger-ui.html et /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
