server:
  port: 8084

# =============================================================================
# Configuration par défaut = PostgreSQL (production / Docker)
# Les variables d'environnement SPRING_DATASOURCE_* sont obligatoires.
# Pour le dev local sans Docker, activer le profil "h2" :
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =============================================================================
spring:
  datasource:
    url:              ${SPRING_DATASOURCE_URL}
    username:         ${SPRING_DATASOURCE_USERNAME}
    password:         ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none        # Flyway gère le schéma, pas Hibernate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health

# Simulation switches (S5-09)
cnts:
  latency-ms:            ${CNTS_LATENCY_MS:0}
  fail-rate:             ${CNTS_FAIL_RATE:0.0}
  volume-prelevement-ml: ${VOLUME_PRELEVEMENT_ML:450}
  delai-normal-minutes:  60
  delai-critique-minutes: 15

---
# =============================================================================
# Profil "h2" : développement local sans Docker
# Lancer avec : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =============================================================================
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url:              jdbc:h2:mem:cntsdb;DB_CLOSE_DELAY=-1
    username:         sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # H2 crée les tables depuis les entités JPA (pas de Flyway)
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    # Flyway OFF sur H2 : les migrations sont en syntaxe PostgreSQL
    enabled: false
