server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cntsdb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false   # disabled for local dev without PostgreSQL

management:
  endpoints:
    web:
      exposure:
        include: health

# Simulation switches (Section 16 of the study)
cnts:
  latency-ms: ${CNTS_LATENCY_MS:0}
  fail-rate: ${CNTS_FAIL_RATE:0.0}
  volume-prelevement-ml: ${VOLUME_PRELEVEMENT_ML:450}
  delai-normal-minutes: 60
  delai-critique-minutes: 15
